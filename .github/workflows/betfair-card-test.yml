name: Isolated Betfair card tests
on:
  push:
    branches: [test-sportsbet-card-extractor]
    paths:
      - "test/betfair-card/**"
      - ".github/workflows/betfair-card-test.yml"
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node test/betfair-card/betfair-card.test.mjs
